# Every push to main builds a release APK and publishes it as the one and only GitHub
# Release. Version = <baseVersionName from gradle.properties>.<run number>, and
# versionCode = the run number, so both move forward without a commit to bump them.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    `base64 -i release.keystore | tr -d '\n'`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK still builds, but unsigned and uninstallable.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Releases are cut from the tip of main; a queued run would only publish a version the
# next one immediately deletes.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is unset — the release APK will be unsigned."
          fi
          ./gradlew assembleRelease

      - name: Stage the APK under its version
        id: stage
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^baseVersionName=//p' gradle.properties).$GITHUB_RUN_NUMBER"
          # AGP names the output app-release-unsigned.apk when no keystore was supplied.
          APK="$(ls app/build/outputs/apk/release/*.apk | grep -v -- '-unsigned' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          fi
          mkdir -p out
          cp "$APK" "out/table-client-android-$VERSION.apk"
          # R8 obfuscates the release build, so a stack trace off this APK is unreadable
          # without the matching mapping. Only the newest release survives the prune below,
          # so it has to ship with the APK rather than live in a build artifact.
          gzip -c app/build/outputs/mapping/release/mapping.txt > "out/mapping-$VERSION.txt.gz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release, dropping the previous one
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "out/table-client-android-$VERSION.apk" \
            "out/mapping-$VERSION.txt.gz" \
            --title "v$VERSION" \
            --target "$GITHUB_SHA" \
            --notes "Automated build of ${GITHUB_SHA:0:7}."
          # "Only keep the latest release": every other release and its tag goes.
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "v$VERSION" ]; then
              echo "Deleting release and tag $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
